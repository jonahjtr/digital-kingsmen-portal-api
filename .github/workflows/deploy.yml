name: Deploy API

on:
  push:
    branches:
      - main
      - production

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cca5a114f4b3baf1459a9b2697cad2e1
        run: npm run cf:migrate:remote

      - name: Deploy staging (main)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cca5a114f4b3baf1459a9b2697cad2e1
        run: npm run deploy:staging

      - name: Set MCP API key (staging)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cca5a114f4b3baf1459a9b2697cad2e1
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
        run: |
          if [ -n "$MCP_API_KEY" ]; then
            echo "$MCP_API_KEY" | npx wrangler secret put MCP_API_KEY --env staging
          fi

      - name: Deploy production (production branch)
        if: github.ref == 'refs/heads/production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cca5a114f4b3baf1459a9b2697cad2e1
        run: npm run deploy

      - name: Set MCP API key (production)
        if: github.ref == 'refs/heads/production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cca5a114f4b3baf1459a9b2697cad2e1
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
        run: |
          if [ -n "$MCP_API_KEY" ]; then
            echo "$MCP_API_KEY" | npx wrangler secret put MCP_API_KEY
          fi
